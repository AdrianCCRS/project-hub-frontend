apiVersion: v1
kind: Service
metadata:
  name: projecthub-frontend-service
  namespace: projecthub-frontend
  labels:
    app: projecthub-frontend
spec:
  type: NodePort # Easy access for development
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30000 # Fixed port for easy access
    protocol: TCP
    name: http
  selector:
    app: projecthub-frontend
